<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¡Gracias por tu compra! · Francisca Nutrición</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/store.css">
</head>
<body>

<!-- NAV -->
<header class="nav">
  <div class="wrap" style="padding-inline:14px">
    <div class="nav-inner">
      <a href="/" class="brand"><span class="leaf">❋</span>Francisca Nutrición</a>
      <div class="nav-cta">
        <a href="/tienda.html" class="btn btn-ghost">Ver más iBooks</a>
      </div>
    </div>
  </div>
</header>

<section class="section-pad">
  <div class="wrap">
    <div class="panel center">
      <div class="check-badge">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <span class="eyebrow" style="justify-content:center">Pago confirmado</span>
      <h2 style="font-size:clamp(1.8rem,4vw,2.6rem);margin:.6rem 0 1rem">¡Gracias por tu compra!</h2>

      <div id="state">
        <p class="muted">Estamos confirmando tu pago…</p>
        <div class="spinner"></div>
        <p class="muted" style="font-size:.9rem">Esto puede tardar unos segundos.</p>
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    <div class="foot-bottom">
      <span>© <span id="year"></span> Francisca Fernandez · Licenciada en Nutrición.</span>
      <span><a href="/">Inicio</a></span>
    </div>
  </div>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  const params = new URLSearchParams(location.search);
  // Mercado Pago agrega payment_id en la back_url de éxito.
  const paymentId = params.get('payment_id') || params.get('collection_id');
  const statusEl = document.getElementById('state');

  function ready(data) {
    const greeting = data.buyer_name ? `, ${data.buyer_name}` : '';
    statusEl.innerHTML = `
      <p style="font-size:1.1rem;margin-bottom:.4rem">Tu iBook <strong>${data.product_title}</strong> ya está listo${greeting}.</p>
      <p class="muted" style="margin-bottom:1.6rem">También te enviamos el enlace de descarga por email.</p>
      <a class="btn btn-primary" href="${data.download_url}">
        Descargar PDF
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14"/></svg>
      </a>`;
  }

  function pendingMsg() {
    statusEl.innerHTML = `
      <div class="notice">Tu pago se está procesando. En cuanto se acredite te llegará el iBook por email.
      Si ya pagaste, podés recargar esta página en unos minutos.</div>
      <a class="btn btn-ghost" href="/tienda.html">Volver a la tienda</a>`;
  }

  function errorMsg() {
    statusEl.innerHTML = `
      <div class="notice error">No pudimos identificar tu compra. Si ya realizaste el pago,
      revisá tu email: te enviamos el enlace de descarga. Ante cualquier duda, escribinos.</div>
      <a class="btn btn-ghost" href="/tienda.html">Volver a la tienda</a>`;
  }

  async function poll(attempt = 0) {
    if (!paymentId) return errorMsg();
    try {
      const res = await fetch(`/api/order?payment_id=${encodeURIComponent(paymentId)}`);
      const data = await res.json();
      if (data.status === 'ready') return ready(data);
      if (attempt >= 8) return pendingMsg(); // ~24s de espera máx.
      setTimeout(() => poll(attempt + 1), 3000);
    } catch (err) {
      console.error(err);
      if (attempt >= 8) return errorMsg();
      setTimeout(() => poll(attempt + 1), 3000);
    }
  }

  poll();
</script>
</body>
</html>
